# ============================================================================
#  Configuración del Agente de Estimación IDW · v4
#  Las rutas relativas se resuelven contra la carpeta raíz del repositorio (donde está este config/).
#  Variables de entorno: AGENTE_ROOT, AGENTE_PYTHON, AGENTE_RUNS_DIR, AGENTE_TEMPLATES_DIR, AGENTE_WORKSPACE_FILE, HF_TOKEN (API key).
# ============================================================================

# Proyecto cuyas herramientas se orquestan. Vive DENTRO del agente:
#   Proyecto_IDW/Flujo_Estimacion  (scripts)   ·   Proyecto_IDW/Configuraciones  (conf_*.json)
# Los datos de entrada (01_Data) y de salida (02_Resultados) NO tienen que estar aquí: la interfaz web te pide
# las carpetas al abrirse y reubica las rutas de los conf (con respaldo).
idw_root: Proyecto_IDW

# Carpeta (relativa a la raíz) donde viven los conf_*.json.
config_dir: Configuraciones

# Intérprete con el que se ejecutan las herramientas. Por defecto: el mismo Python que abre el agente (tu venv activo).
# Para usar otro, descomenta la línea o define la variable de entorno AGENTE_PYTHON.
# python: C:/ruta/a/tu/venv/Scripts/python.exe

# Catálogos de herramientas (YAML). Para añadir una herramienta basta editar uno de estos archivos.
catalogs:
  - catalog/tools_idw.yaml
  # - catalog/tools_demo.yaml      # demo ficticia: usar con --root examples/demo_project

# Carpetas de trabajo del agente.
runs_dir: runs                       # estado + trazas por ejecución (permite reanudar)
templates_dir: plantillas_generadas  # plantillas creadas cuando falta un archivo (nunca toca el proyecto)
prompts_dir: prompts

default_timeout_s: 3600

# ----------------------------------------------------------------------------
#  Modelo de lenguaje (v3): SLM en la NUBE (Hugging Face) con tu API key. También puedes usar el SLM local (Ollama).
#     SLM  ->  (reintentos con el error de validación)  ->  reglas por palabras clave (siempre disponibles)
#  Qué sale de tu equipo con la nube: tu frase, el catálogo de herramientas y, en el chat, las fichas del manual que
#  responden tu duda. NUNCA tus archivos de datos ni tus rutas.
# ----------------------------------------------------------------------------
llm:
  enabled: true              # false = solo reglas por palabras clave (sin modelo)
  provider: huggingface      # huggingface (nube) | ollama (local, sin red)
  report_with_llm: false     # true = el informe incluye un resumen en prosa redactado por el modelo (validado; más lento)
  max_retries: 2             # reintentos tras la 1.ª respuesta inválida
  arbitrate_with_rules: true # el léxico del catálogo fija intención/workflow/rango y exige respaldo para cada herramienta
                             # (sube 'exact' y baja a ~0 las acciones inseguras; ver docs/EVALUACION.md)

  cloud:
    base_url: https://router.huggingface.co/v1     # API compatible con OpenAI (Inference Providers de Hugging Face)
    token_env: HF_TOKEN       # variable de entorno con tu API key (o escríbela en la barra lateral; no se guarda en disco)
    model: google/gemma-3-4b-it
    temperature: 0.0
    max_tokens: 600
    timeout_s: 90
    retries: 2                # reintentos ante 429 (límite) o 5xx
    max_models: 5
    # Lista desplegable (máximo 5). Los precios son de REFERENCIA (US$ por millón de tokens, del catálogo público del router
    # en noviembre de 2026; cambian por proveedor): la interfaz puede verificar la disponibilidad real con «Probar modelos».
    models:
      - {id: google/gemma-3-4b-it, label: Gemma 3 4B, params: 4B, price_in: 0.05, price_out: 0.10,
         note: "Es el mismo modelo que ya tenías instalado (gemma3:4b), ahora en la nube."}
      - {id: Qwen/Qwen3-VL-30B-A3B-Instruct, label: Qwen3-VL 30B-A3B, params: "30B (3B activos)", price_in: 0.15, price_out: 0.60,
         note: "Misma familia que tu qwen3-vl:4b (la variante de 4B no está en la nube); mezcla de expertos con 3B activos."}
      - {id: ibm-granite/granite-4.2-3b, label: Granite 4.2 3B, params: 3B, price_in: 0.03, price_out: 0.12,
         note: "El más pequeño y barato de la lista: sirve de piso de comparación."}
      - {id: meta-llama/Llama-3.1-8B-Instruct, label: Llama 3.1 8B, params: 8B, price_in: 0.02, price_out: 0.05,
         note: "Referencia abierta muy usada (se vio una familia parecida en la clase: Llama 3.2 3B)."}
      - {id: microsoft/phi-4, label: Phi-4 14B, params: 14B, price_in: 0.07, price_out: 0.14,
         note: "Familia Phi de la clase (Phi-4-mini); el más grande de la lista para ver si más tamaño mejora la exactitud."}

  # SLM local (Ollama): alternativa sin internet. Se elige con provider: ollama o en la barra lateral.
  models: [gemma3:4b, qwen3-vl:4b-instruct]   # lista desplegable del modo local (deben estar instalados: ollama list)
  primary:
    model: gemma3:4b
    base_url: http://localhost:11434
    temperature: 0.0
    num_ctx: 4096
    num_predict: 400
    timeout_s: 180           # la GPU es compartida: la 1.ª carga puede tardar minutos
    keep_alive: 10m
    use_json_format: false   # true = format:"json" de Ollama. Con gemma3 (vocab 262k) la gramática es lenta; se pide JSON por prompt.

# ----------------------------------------------------------------------------
#  Seguridad
# ----------------------------------------------------------------------------
safety:
  confirm_destructive: true      # pedir confirmación explícita antes de sobrescribir salidas / modificar la base
  backup_overwritten: false      # true = copiar a .bak_<fecha> las salidas que se van a sobrescribir
  backup_max_mb: 200             # no respaldar archivos más grandes que esto
  backup_config_before_fix: true # siempre respaldar los conf_*.json antes de corregir rutas
  extra_allowed_roots: []        # carpetas adicionales aceptadas para parámetros tipo ruta

# Rutas absolutas en los conf_*.json: carpetas ancla para reubicarlas. '01_Data' apunta a la carpeta de ENTRADA
# elegida en la interfaz, '02_Resultados' a la de SALIDA; 'Configuraciones' a Proyecto_IDW/Configuraciones.
path_anchors: [01_Data, 02_Resultados, Configuraciones]
